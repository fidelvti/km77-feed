name: Debug km77 access
on:
  workflow_dispatch: {}
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: curl km77 plain page
        run: |
          curl -s -o /tmp/resp2.html -w "PLAIN_PAGE_STATUS:%{http_code}\n" -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" "https://www.km77.com/revista/"
          head -c 300 /tmp/resp2.html
          echo ""
      - name: curl km77 wp-json
        run: |
          curl -s -o /tmp/resp.html -w "WPJSON_STATUS:%{http_code}\n" -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" "https://www.km77.com/revista/wp-json/wp/v2/posts?per_page=1"
          head -c 300 /tmp/resp.html
          echo ""
